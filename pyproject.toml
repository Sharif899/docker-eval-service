[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-eval-service"
version = "0.1.0"
description = "Dockerised LLM evaluation API: deterministic rubric scoring (1-5, five criteria), pairwise RLHF comparison, PostgreSQL persistence and aggregate metrics."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Sherif Olabode" }]
keywords = ["llm", "evaluation", "rlhf", "fastapi", "postgresql", "docker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27", "httpx2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
