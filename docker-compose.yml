services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eval-api
    environment:
      DATABASE_URL: postgresql://eval:${POSTGRES_PASSWORD:-evalpass}@postgres:5432/evaldb
      PORT: "8000"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: eval-postgres
    environment:
      POSTGRES_USER: eval
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evalpass}
      POSTGRES_DB: evaldb
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eval -d evaldb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
